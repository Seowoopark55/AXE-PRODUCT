<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0d11" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <style>
      html,body,#app{min-height:100%;margin:0;background:#090b0f;color:#f1f4f7}
      .pwa-boot{min-height:100vh;display:grid;place-items:center;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
      .pwa-boot__mark{display:grid;justify-items:center;gap:10px;color:#f1f4f7}
      .pwa-boot__icon{width:48px;height:48px;border:1px solid #27313c;border-radius:12px;background:#0f141a;display:grid;place-items:center;color:#e4b24b;font-weight:950;font-size:21px;letter-spacing:-.04em}
      .pwa-boot__copy{display:grid;justify-items:center;gap:2px}.pwa-boot__copy strong{font-size:13px;letter-spacing:.045em}.pwa-boot__copy small{color:#687481;font-size:8px;font-weight:800;letter-spacing:.15em}
    </style>
    <title>AXE PRODUCT</title>
  </head>
  <body>
    <div id="app"><section class="pwa-boot" aria-label="AXE PRODUCT 시작 중"><div class="pwa-boot__mark"><div class="pwa-boot__icon">A</div><div class="pwa-boot__copy"><strong>AXE PRODUCT</strong><small>OPERATIONS CONSOLE</small></div></div></section></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
